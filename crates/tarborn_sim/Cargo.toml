[package]
name = "tarborn_sim"
description = "Deterministic, engine-free simulation core for Tarborn: the tar blob and its controls."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
glam.workspace = true
serde = { workspace = true, optional = true }

[features]
# Serialise level data (enemy kinds and states, vectors) for the RON chunk files.
serde = ["dep:serde", "glam/serde"]
