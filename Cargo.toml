[workspace]
resolver = "3"
members = ["crates/tarborn_sim", "crates/tarborn_sfx", "crates/tarborn_pcg", "crates/tarborn_music", "crates/tarborn"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.97.1"

[workspace.dependencies]
# Keep glam in lockstep with the version Bevy re-exports, so sim types are Bevy types.
glam = "0.33"
bevy = { version = "0.20.1", default-features = false, features = ["2d", "audio", "ui_bevy_render", "ui_picking"] }
tarborn_sim = { path = "crates/tarborn_sim" }
tarborn_sfx = { path = "crates/tarborn_sfx" }
tarborn_pcg = { path = "crates/tarborn_pcg" }
tarborn_music = { path = "crates/tarborn_music" }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"

# Bevy is unusably slow at opt-level 0. Optimise our code a little and dependencies fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The simulation and the generators run thousands of simulated seconds in
# tests (bots search in the full sim), so build them fully optimised too.
[profile.dev.package.tarborn_sim]
opt-level = 3

[profile.dev.package.tarborn_pcg]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
